spring.application.name=nexus
server.port=8080

# MySQL. The password is read from the DB_PASSWORD environment variable so it is never written in the repository.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nexus_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Tables are created and updated automatically from the domain mappings.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# First administrator, created only when it does not exist yet.
nexus.seed.admin.identifier=${ADMIN_IDENTIFIER:ADMIN-001}
nexus.seed.admin.password=${ADMIN_PASSWORD:Admin123*}

# Swagger UI: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
